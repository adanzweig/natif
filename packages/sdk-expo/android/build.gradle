plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.benatif'
version = '0.1.0'

android {
  namespace "com.benatif.expo"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk { abiFilters 'arm64-v8a' }
    consumerProguardFiles 'consumer-rules.pro'
  }
  packagingOptions {
    jniLibs { useLegacyPackaging = false }
  }
}
